<!DOCTYPE html>
<html>
<head>
    <title>Personal Profile</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            width: 600px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            color: #5b21b6;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .info {
            background: #f3f0ff;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
        }

        .info b {
            color: #5b21b6;
        }

        .skills span {
            display: inline-block;
            background: #e9d5ff;
            color: #5b21b6;
            padding: 8px 14px;
            margin: 5px;
            border-radius: 20px;
        }

        .objective {
            background: #f8f8f8;
            padding: 15px;
            border-radius: 10px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Kushmitha N</h1>
        <p class="subtitle">Personal Profile</p>

        <div class="info">
            <b>Register Number:</b> 24MIS0561
        </div>

        <div class="info">
            <b>Department:</b> MIS
        </div>

        <div class="info">
            <b>Skills:</b>
            <div class="skills">
                <span>HTML</span>
                <span>CSS</span>
                <span>Java</span>
                <span>Docker</span>
                <span>Kubernetes</span>
            </div>
        </div>

        <div class="info">
            <b>Career Objective:</b>
            <div class="objective">
                To develop my technical skills and build a successful
                career in the IT industry.
            </div>
        </div>

    </div>

</body>
</html>
