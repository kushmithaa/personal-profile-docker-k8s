apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: profile-app
  template:
    metadata:
      labels:
        app: profile-app
    spec:
      containers:
      - name: profile-app
        image: kushmithaa/profile-app:latest
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: profile-app-service
spec:
  type: NodePort
  selector:
    app: profile-app
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30010
